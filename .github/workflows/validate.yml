name: Validar bot Python

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar sintaxe
        run: python -m py_compile app/bot.py bot.py
